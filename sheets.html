<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>8 Count Sheets — MAX Cheer Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/max.css?v=sheet" />
</head>
<body data-page="sheets">
  <main>
    <section class="section">
      <div class="wrap sheet-intro">
        <div class="prose">
          <p class="kicker">Counts</p>
          <h1>8 count sheets</h1>
          <p>Type the team name, sections, and counts right here. Print or save as PDF, then upload it in the Portal with your order.</p>
          <p class="sheet-actions no-print">
            <button class="btn" type="button" id="sheet-print">Print / save as PDF</button>
            <button class="btn btn-outline" type="button" id="sheet-clear">Clear sheet</button>
          </p>
          <p class="hint no-print" id="sheet-status">In the print window, choose Save as PDF.</p>
        </div>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="wrap">
        <form id="count-sheet" class="count-sheet" autocomplete="off">
          <div class="sheet-head">
            <img src="assets/max-logo.png" alt="MAX Cheer Music" />
            <label>
              <span>Team name</span>
              <input name="team_name" placeholder="Team name" />
            </label>
          </div>
          <div id="sheet-page-1" class="sheet-page"></div>
          <div id="sheet-page-2" class="sheet-page"></div>
        </form>
      </div>
    </section>
  </main>
  <script src="js/cart.js"></script>
  <script src="js/site.js"></script>
  <script src="js/sheets.js"></script>
</body>
</html>
